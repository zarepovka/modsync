name: Desktop Builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: ModSync-Windows-x64
            archive: artifacts/ModSync-Windows-x64.zip
          - os: macos-latest
            label: macOS
            artifact: ModSync-macOS
            archive: artifacts/ModSync-macOS.zip
          - os: ubuntu-latest
            label: Linux x64
            artifact: ModSync-Linux-x64
            archive: artifacts/ModSync-Linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install GUI and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,dev,build]"

      - name: Run complete test suite
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: GUI import and launch smoke test
        run: python -m modsync.gui.app --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build and smoke-test portable desktop package
        run: python scripts/build_gui.py

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
