[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modsync"
dynamic = ["version"]
description = "Cross-platform mod manager with profiles, safe updates, and rollback"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ModSync contributors" }]
dependencies = ["requests>=2.32,<3"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5"]
build = ["PyInstaller>=6.11,<7", "Pillow>=11,<13"]

[project.scripts]
modsync = "modsync.cli:main"
modsync-gui = "modsync.gui.app:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["modsync*"]

[tool.setuptools.package-data]
"modsync.gui.resources" = ["*.svg"]

[tool.setuptools.dynamic]
version = { attr = "modsync.__version__" }
